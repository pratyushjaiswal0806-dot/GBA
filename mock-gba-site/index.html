<!doctype html>
<html lang="en">
  <head>
    <script>const portalAddress = 'https://frontend-drab-tau-zggj3o49bd.vercel.app/';</script>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#eef3f0">
    <title>GBA Portal (demo)</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #183a34; background: #eef3f0; }
      * { box-sizing: border-box; }
      body { margin: 0; min-width: 320px; background: radial-gradient(ellipse at 85% 0%, #d9eae2, transparent 34rem), #eef3f0; }
      main { max-width: 52rem; margin: 0 auto; padding: clamp(1.5rem, 7vw, 4.5rem) 1.25rem; }
      article { overflow: hidden; border: 1px solid #d8e3de; border-radius: 1rem; background: white; box-shadow: 0 1rem 2rem rgb(24 58 52 / 7%); }
      .topline { height: .45rem; background: #176b58; }
      .content { padding: clamp(1.25rem, 5vw, 2.5rem); }
      .eyebrow { color: #176b58; font-size: .78rem; font-weight: 750; letter-spacing: .04em; }
      h1 { max-width: 15ch; margin: .65rem 0 0; font-size: clamp(2rem, 8vw, 3.2rem); line-height: 1.04; letter-spacing: -.05em; text-wrap: balance; }
      p { color: #596b65; line-height: 1.6; }
      a { display: inline-flex; min-height: 2.85rem; align-items: center; margin-top: 1rem; border-radius: .65rem; background: #176b58; color: white; padding: .75rem 1rem; font-weight: 720; text-decoration: none; }
      a:hover { background: #125545; }
      a:focus-visible { outline: 3px solid #d28e21; outline-offset: 3px; }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
    </style>
  </head>
  <body>
    <main>
      <article>
        <div aria-hidden="true" class="topline"></div>
        <div class="content">
        <p class="eyebrow">Greater Bengaluru Authority</p>
        <h1>Citizen services portal</h1>
        <p>This is a small local stand-in for the external GBA page used in the pilot demo.</p>
        <a aria-label="Open the GBA Civic Issue Tracker portal" href="#" id="portal-link">GBA Portal</a>
        </div>
      </article>
    </main>
    <script>document.getElementById('portal-link').href = portalAddress;</script>
  </body>
</html>
