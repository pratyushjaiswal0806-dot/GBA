<!doctype html>
<html lang="en">
  <head>
    <script>const portalAddress = 'http://localhost:3000/';</script>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GBA Portal (demo)</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; }
      body { margin: 0; background: #eef6f7; color: #12303a; }
      main { max-width: 44rem; margin: 0 auto; padding: 3rem 1.25rem; }
      article { background: white; border: 1px solid #c9e2e5; border-radius: 1rem; padding: 2rem; box-shadow: 0 1rem 2rem rgb(18 48 58 / 10%); }
      a { display: inline-block; margin-top: 1.25rem; padding: .75rem 1rem; border-radius: .5rem; background: #087f8c; color: white; font-weight: 700; text-decoration: none; }
      a:hover { background: #05636d; }
    </style>
  </head>
  <body>
    <main>
      <article>
        <p>Greater Bengaluru Authority</p>
        <h1>Citizen services portal</h1>
        <p>This is a small local stand-in for the external GBA page used in the pilot demo.</p>
        <a href="#" id="portal-link">GBA Portal</a>
      </article>
    </main>
    <script>document.getElementById('portal-link').href = portalAddress;</script>
  </body>
</html>
